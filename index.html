<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon (SVG primary, PNG fallback for Google) ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO (static baseline, overridden per-page by SEO component) ── -->
    <title>TrioCraft | Design &amp; Development</title>
    <meta name="description" content="TrioCraft is a full-service digital agency in Hyderabad — custom websites, hospital management systems, AI chatbots, influencer marketing, and revenue-scaling platforms." />
    <meta name="keywords" content="TrioCraft, Trio Craft, web development agency Hyderabad, digital marketing agency, AI chatbot development, hospital management system, influencer marketing, web design India" />
    <meta name="author" content="TrioCraft" />
    <meta name="theme-color" content="#ffffff" />

    <!-- ── Canonical ── -->
    <link rel="canonical" href="https://triocraft.in/" />

    <!-- ── Open Graph / Social Sharing ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrioCraft" />
    <meta property="og:url" content="https://triocraft.in/" />
    <meta property="og:title" content="TrioCraft | Design &amp; Development" />
    <meta property="og:description" content="TrioCraft builds custom websites, hospital management systems, AI chatbots, influencer marketing campaigns, and revenue intelligence platforms for businesses in Hyderabad and worldwide." />
    <meta property="og:image" content="https://triocraft.in/triocraft-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter Cards ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrioCraft | Design &amp; Development" />
    <meta name="twitter:description" content="Full-service digital agency in Hyderabad: custom websites, AI chatbots, HMS systems, influencer marketing, and revenue intelligence platforms." />
    <meta name="twitter:image" content="https://triocraft.in/triocraft-logo.png" />

    <!-- ── WebSite JSON-LD (for Google site name & sitelinks searchbox) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TrioCraft",
      "alternateName": "TrioCraft Design & Development",
      "url": "https://triocraft.in/"
    }
    </script>

    <!-- ── Organization / ProfessionalService JSON-LD ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "TrioCraft",
      "alternateName": ["Trio Craft", "TrioCraft Digital Agency", "TrioCraft Design & Development"],
      "url": "https://triocraft.in/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://triocraft.in/triocraft-logo.png",
        "width": 512,
        "height": 512
      },
      "image": "https://triocraft.in/triocraft-logo.png",
      "description": "TrioCraft is a full-service digital design, custom engineering, and AI agency based in Hyderabad, India. We build web applications, hospital management systems, AI chatbots, influencer marketing campaigns, and revenue-scaling platforms.",
      "email": "trioocraaft@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Hyderabad",
        "addressRegion": "Telangana",
        "addressCountry": "IN"
      },
      "areaServed": "Worldwide",
      "serviceType": ["Web Development", "Digital Marketing", "AI Chatbot Development", "Hospital Management Systems", "Influencer Marketing"],
      "sameAs": [
        "https://github.com/Tharun799337"
      ],
      "priceRange": "₹₹"
    }
    </script>

    <!-- ── Fonts: Space Grotesk & Inter ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FFFFFF] text-[#1a1f22] font-sans selection:bg-[#FEE2E2] selection:text-[#991B1B] overflow-x-hidden relative">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
