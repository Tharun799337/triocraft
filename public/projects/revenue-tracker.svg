<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="revBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="revCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#065F46" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#revBg)" />

  <!-- Background Grid Lines -->
  <g opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#059669" stroke-dasharray="4,8" />
    <line x1="0" y1="200" x2="800" y2="200" stroke="#059669" stroke-dasharray="4,8" />
    <line x1="0" y1="300" x2="800" y2="300" stroke="#059669" stroke-dasharray="4,8" />
    <line x1="0" y1="400" x2="800" y2="400" stroke="#059669" stroke-dasharray="4,8" />
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="180" height="32" rx="16" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
  <circle cx="56" cy="52" r="5" fill="#10B981" />
  <text x="70" y="57" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065F46" letter-spacing="1">FINANCIAL INTELLIGENCE</text>

  <!-- Section Title -->
