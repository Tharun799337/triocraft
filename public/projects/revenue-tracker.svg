      <text x="18" y="85" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Growth Pro Tier</text>
      <text x="18" y="96" font-family="system-ui, sans-serif" font-size="8" fill="#10B981">+$299/mo • Razorpay</text>

      <rect x="10" y="108" width="148" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="18" y="123" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Addon Seat Pack</text>
      <text x="18" y="134" font-family="system-ui, sans-serif" font-size="8" fill="#10B981">+$99/mo • PayPal</text>
    </g>
  </g>
</svg>
