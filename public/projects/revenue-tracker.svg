      <text x="14" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#059669">0.82%</text>
      <text x="14" y="64" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10B981">▼ Low risk threshold</text>
