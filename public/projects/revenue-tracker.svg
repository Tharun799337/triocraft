  <text x="40" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#047857">Real-time MRR/ARR, Stripe Webhooks, Cash Flow &amp; Cohort LTV</text>

  <!-- Main Dashboard Frame -->
  <g transform="translate(40, 155)" filter="url(#revCardShadow)">
    <rect width="720" height="310" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" />
    
    <!-- Top Browser Header -->
    <rect width="720" height="36" rx="16" fill="#F0FDF4" />
    <rect y="26" width="720" height="10" fill="#F0FDF4" />
    <line x1="0" y1="36" x2="720" y2="36" stroke="#E2E8F0" stroke-width="1" />
    
    <circle cx="24" cy="18" r="5" fill="#EF4444" />
    <circle cx="40" cy="18" r="5" fill="#F59E0B" />
    <circle cx="56" cy="18" r="5" fill="#10B981" />
    <rect x="90" y="9" width="310" height="18" rx="9" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1" />
    <text x="105" y="22" font-family="monospace" font-size="10" fill="#047857">https://revpulse.triocraft.studio/analytics</text>

    <!-- Stat 1: Monthly Recurring Revenue -->
    <g transform="translate(24, 52)">
      <rect width="155" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">CURRENT MRR</text>
      <text x="14" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">$48,250</text>
      <text x="14" y="64" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10B981">▲ +24.8% vs last mo</text>
