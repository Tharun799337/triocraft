    </g>

    <!-- Revenue Graph Visual Area -->
    <g transform="translate(24, 138)">
      <rect width="490" height="150" rx="10" fill="#FAFAFA" stroke="#F1F5F9" />
      <!-- Grid lines inside chart -->
      <line x1="30" y1="30" x2="460" y2="30" stroke="#E2E8F0" stroke-dasharray="3,3" />
      <line x1="30" y1="65" x2="460" y2="65" stroke="#E2E8F0" stroke-dasharray="3,3" />
      <line x1="30" y1="100" x2="460" y2="100" stroke="#E2E8F0" stroke-dasharray="3,3" />
      
      <!-- Chart Area Path -->
