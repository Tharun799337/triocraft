      <rect width="168" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">LIVE PAYMENTS</text>
      
      <rect x="10" y="32" width="148" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="18" y="47" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Enterprise Plan</text>
      <text x="18" y="58" font-family="system-ui, sans-serif" font-size="8" fill="#10B981">+$2,490/yr • Stripe</text>

