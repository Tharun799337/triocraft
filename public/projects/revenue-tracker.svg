    <!-- Stat 2: Annual Run Rate -->
    <g transform="translate(192, 52)">
      <rect width="155" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">ANNUALIZED ARR</text>
      <text x="14" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">$579,000</text>
      <text x="14" y="64" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10B981">▲ 142 Active Subscriptions</text>
