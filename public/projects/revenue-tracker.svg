      <circle cx="150" cy="85" r="4" fill="#059669" />
      <circle cx="270" cy="60" r="4" fill="#059669" />
      <circle cx="360" cy="40" r="4" fill="#059669" />
      <circle cx="460" cy="20" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />

      <text x="30" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Jan</text>
      <text x="150" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Apr</text>
      <text x="270" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Jul</text>
      <text x="360" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Oct</text>
      <text x="445" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#059669" font-weight="700">Dec (Peak)</text>
