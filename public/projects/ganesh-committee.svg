<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ganeshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c06" />
      <stop offset="100%" stop-color="#090502" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ganeshBg)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Top bar -->
  <rect width="800" height="48" rx="16" fill="#1f130b" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <text x="120" y="28" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">GANESH UTSAV COMMUNITY PORTAL // ADMIN &amp; RECEIPT PORTAL</text>

  <!-- Left: Donation entry form & fast receipt -->
  <g transform="translate(30, 70)">
    <rect width="360" height="395" rx="10" fill="#180e07" stroke="rgba(245,158,11,0.2)" />
    <text x="20" y="32" fill="#fed7aa" font-family="sans-serif" font-size="13" font-weight="bold">Quick Donor Entry &amp; Instant Receipt</text>

    <!-- Field 1 -->
    <text x="20" y="65" fill="#9a7452" font-family="sans-serif" font-size="10">DONOR FULL NAME</text>
    <rect x="20" y="75" width="320" height="34" rx="6" fill="#26170d" stroke="#3b2314" />
    <text x="32" y="96" fill="#fef3c7" font-family="sans-serif" font-size="12">Ramesh Sharma &amp; Family</text>

    <!-- Field 2 -->
    <text x="20" y="130" fill="#9a7452" font-family="sans-serif" font-size="10">DONATION AMOUNT (INR)</text>
    <rect x="20" y="140" width="320" height="34" rx="6" fill="#26170d" stroke="#3b2314" />
    <text x="32" y="162" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">₹ 5,001 /- (Special Puja)</text>

    <!-- Field 3 -->
    <text x="20" y="195" fill="#9a7452" font-family="sans-serif" font-size="10">PHONE / WHATSAPP NUMBER</text>
    <rect x="20" y="205" width="320" height="34" rx="6" fill="#26170d" stroke="#3b2314" />
    <text x="32" y="226" fill="#fef3c7" font-family="sans-serif" font-size="12">+91 98450 12345</text>

    <!-- Action Buttons -->
    <rect x="20" y="260" width="320" height="42" rx="6" fill="url(#goldGrad)" />
    <text x="180" y="286" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Generate &amp; Send PDF Receipt (SMS/WhatsApp)</text>

    <!-- Mini Receipt Preview Slip -->
    <rect x="20" y="315" width="320" height="60" rx="6" fill="#0d0704" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4 4" />
    <text x="32" y="338" fill="#34d399" font-family="monospace" font-size="10">✓ RECEIPT #GUC-2026-0842 ISSUED</text>
    <text x="32" y="356" fill="#9ca3af" font-family="monospace" font-size="9">Stored to Firestore Cloud • Offline Sync Enabled</text>
  </g>

  <!-- Right: Transparent Ledger & Volunteer Shift Roster -->
  <g transform="translate(410, 70)">
    <!-- Summary stats -->
    <rect width="360" height="85" rx="10" fill="#180e07" stroke="rgba(245,158,11,0.2)" />
    <text x="20" y="28" fill="#d97706" font-family="sans-serif" font-size="11" font-weight="bold">Total Collections (Day 5)</text>
    <text x="20" y="58" fill="#fbbf24" font-family="sans-serif" font-size="24" font-weight="bold">₹ 4,82,400</text>
    <text x="220" y="28" fill="#9ca3af" font-family="sans-serif" font-size="11">Total Donors: 342</text>
    <text x="220" y="58" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">100% Verified</text>

    <!-- Volunteer shift timeline -->
    <rect y="100" width="360" height="295" rx="10" fill="#180e07" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="128" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Volunteer Task Roster (Evening Aarti)</text>

    <g transform="translate(20, 145)">
      <rect width="320" height="48" rx="6" fill="#24140b" />
      <text x="15" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Prasadam Distribution Zone A</text>
      <text x="15" y="38" fill="#9a7452" font-family="sans-serif" font-size="10">Volunteers: Ankit, Vikas, Rahul • 06:30 PM - 09:00 PM</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="320" height="48" rx="6" fill="#24140b" />
      <text x="15" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Queue &amp; Crowd Management Zone B</text>
      <text x="15" y="38" fill="#9a7452" font-family="sans-serif" font-size="10">Volunteers: Karthik, Suresh, 4 Others • Active Now</text>
    </g>

    <g transform="translate(20, 265)">
      <rect width="320" height="48" rx="6" fill="#24140b" />
      <text x="15" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Treasury &amp; Cash Counter Reconcile</text>
      <text x="15" y="38" fill="#9a7452" font-family="sans-serif" font-size="10">Treasurer: Tharun &amp; Committee Lead</text>
    </g>

    <text x="180" y="375" fill="#9a7452" font-family="monospace" font-size="9" text-anchor="middle">Responsive PWA • Built with React &amp; Firebase</text>
  </g>
</svg>
