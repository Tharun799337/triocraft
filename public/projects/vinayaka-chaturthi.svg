<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EB" />
      <stop offset="50%" stop-color="#FFEAD6" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="marigoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Festive Rangoli / Mandala Pattern in Background -->
  <g opacity="0.15" transform="translate(680, 100)">
    <circle r="180" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6,6" />
    <circle r="130" fill="none" stroke="#D97706" stroke-width="3" />
    <circle r="80" fill="none" stroke="#EA580C" stroke-width="2" />
    <path d="M 0 -130 L 0 130 M -130 0 L 130 0 M -90 -90 L 90 90 M -90 90 L 90 -90" stroke="#D97706" stroke-width="1.5" />
  </g>

  <!-- Left Header Banner Tag -->
  <rect x="40" y="36" width="170" height="32" rx="16" fill="#FEE2E2" />
  <circle cx="56" cy="52" r="5" fill="#DC2626" />
  <text x="70" y="57" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991B1B" letter-spacing="1">LIVE PUJA PORTAL</text>

  <!-- Project Title on Graphic -->
  <text x="40" y="105" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#431407">Vinayaka Chavithi Maha Utsav</text>
  <text x="40" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#78350F">Online Aarti, Digital Hundi, Laddu Auction &amp; Event Booking</text>

  <!-- Main Website Mockup Frame -->
  <g transform="translate(40, 155)" filter="url(#cardShadow)">
    <rect width="720" height="310" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
    
    <!-- Browser Header Bar -->
    <rect width="720" height="36" rx="16" fill="#FFFBEB" />
    <rect y="26" width="720" height="10" fill="#FFFBEB" />
    <line x1="0" y1="36" x2="720" y2="36" stroke="#FEF3C7" stroke-width="1" />
    
    <!-- Window Dots -->
    <circle cx="24" cy="18" r="5" fill="#EF4444" />
    <circle cx="40" cy="18" r="5" fill="#F59E0B" />
    <circle cx="56" cy="18" r="5" fill="#10B981" />
    <rect x="90" y="9" width="320" height="18" rx="9" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
    <text x="105" y="22" font-family="monospace" font-size="10" fill="#92400E">https://ganeshutsav-live.triocraft.studio</text>

    <!-- Content Columns -->
    <!-- Col 1: Live Darshan Card -->
    <g transform="translate(24, 52)">
      <rect width="270" height="234" rx="12" fill="url(#crimsonGrad)" />
      <!-- Golden Diya / Symbol -->
      <g transform="translate(135, 80)">
        <ellipse cx="0" cy="20" rx="36" ry="14" fill="#F59E0B" />
        <ellipse cx="0" cy="18" rx="30" ry="10" fill="#D97706" />
        <!-- Flame -->
        <path d="M 0 14 Q -10 2 0 -22 Q 10 2 0 14 Z" fill="url(#marigoldGrad)" />
        <circle cx="0" cy="0" r="5" fill="#FEF08A" />
      </g>
      <text x="135" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">LIVE AARTI STREAM</text>
      <text x="135" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FEE2E2">4K Low-Latency Broadcast</text>
      <rect x="75" y="185" width="120" height="28" rx="14" fill="#F59E0B" />
      <text x="135" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350F">✦ WATCH LIVE (14.2k)</text>
    </g>

    <!-- Col 2: Digital Hundi & Offerings -->
    <g transform="translate(310, 52)">
      <rect width="185" height="110" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="#FEF3C7" />
      <text x="32" y="38" text-anchor="middle" font-size="14">🪙</text>
      <text x="58" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#78350F">DIGITAL HUNDI</text>
      <text x="58" y="47" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">Direct UPI / Card</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#B45309">₹ 8,42,500</text>
      <text x="20" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#15803D">▲ 3,420 devotees contributed</text>

      <!-- Laddu Auction Live Bid Card -->
      <g transform="translate(0, 124)">
        <rect width="185" height="110" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
        <circle cx="32" cy="32" r="16" fill="#FEE2E2" />
        <text x="32" y="38" text-anchor="middle" font-size="14">👑</text>
        <text x="58" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991B1B">MAHA LADDU AUCTION</text>
        <text x="58" y="47" font-family="system-ui, sans-serif" font-size="10" fill="#B91C1C">Current Highest Bid</text>
        <text x="20" y="82" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#DC2626">₹ 15,25,000</text>
        <text x="20" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#991B1B">Closing in 02h : 18m : 42s</text>
      </g>
    </g>

    <!-- Col 3: Puja Schedule & Booking -->
    <g transform="translate(510, 52)">
      <rect width="185" height="234" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Puja Slot Booking</text>
      
      <!-- Slot Item 1 -->
      <rect x="14" y="46" width="157" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Sahasranama Archana</text>
      <text x="24" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#059669">08:00 AM • Available</text>

      <!-- Slot Item 2 -->
      <rect x="14" y="96" width="157" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Maha Ganapathi Homam</text>
      <text x="24" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">10:30 AM • Fast Filling</text>

      <!-- Slot Item 3 -->
      <rect x="14" y="146" width="157" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="24" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Samuhika Modaka Seva</text>
      <text x="24" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#059669">06:00 PM • Available</text>

      <!-- Book Button -->
      <rect x="14" y="198" width="157" height="26" rx="6" fill="#D97706" />
      <text x="92" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">BOOK DEVOTEE PASS ➔</text>
    </g>
  </g>
</svg>
