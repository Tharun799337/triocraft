<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oracleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="oracleRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#oracleBg)" stroke="rgba(234,88,12,0.25)" stroke-width="2" />

  <!-- Chrome Browser Top Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#111827" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  
  <rect x="180" y="12" width="400" height="26" rx="6" fill="#1f2937" />
  <text x="380" y="28" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="middle">careers.oracle.com/jobs/senior-cloud-ai-engineer</text>
  
  <!-- Extension Icon in Browser Bar -->
  <rect x="680" y="10" width="30" height="30" rx="6" fill="url(#cyanPurple)" />
  <text x="695" y="29" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AI</text>

  <!-- Background Web Page (Job Posting being analyzed) -->
  <g transform="translate(40, 70)" opacity="0.6">
    <text x="0" y="25" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="bold">Oracle Cloud Infrastructure (OCI)</text>
    <text x="0" y="55" fill="#f3f4f6" font-family="sans-serif" font-size="20" font-weight="bold">Principal AI / Cloud Systems Architect</text>
    <text x="0" y="85" fill="#9ca3af" font-family="sans-serif" font-size="12">Location: Bengaluru, India / Remote • Full-Time • Job ID: #984210</text>
    
    <rect x="0" y="105" width="420" height="8" rx="4" fill="#374151" />
    <rect x="0" y="125" width="380" height="8" rx="4" fill="#374151" />
    <rect x="0" y="145" width="340" height="8" rx="4" fill="#374151" />
    <rect x="0" y="165" width="400" height="8" rx="4" fill="#374151" />
    <rect x="0" y="185" width="290" height="8" rx="4" fill="#374151" />
  </g>

  <!-- Floating Chrome Extension Modal Overlay (Manifest V3) -->
  <g transform="translate(450, 70)">
    <rect width="320" height="400" rx="14" fill="#0b1329" stroke="url(#cyanPurple)" stroke-width="2" />
    
    <!-- Extension Header -->
    <rect width="320" height="48" rx="14" fill="#131d38" />
    <text x="18" y="29" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Oracle AI Role Advisor</text>
    <rect x="250" y="12" width="55" height="22" rx="4" fill="rgba(16,185,129,0.2)" />
    <text x="277" y="27" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">ACTIVE</text>

    <!-- Role Match Score Card -->
    <g transform="translate(18, 62)">
      <rect width="284" height="65" rx="8" fill="#162244" />
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Profile Compatibility Score</text>
      <text x="14" y="52" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">87% <tspan fill="#34d399" font-size="12" font-weight="normal">(Strong Match)</tspan></text>
      
      <!-- Mini circular progress -->
      <circle cx="240" cy="32" r="22" fill="none" stroke="#1e293b" stroke-width="4" />
      <circle cx="240" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="115 140" stroke-linecap="round" />
    </g>

    <!-- Skill Gap Matrix -->
    <g transform="translate(18, 140)">
      <text x="0" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Identified Skill Match</text>
      
      <g transform="translate(0, 24)">
        <rect width="80" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
        <text x="40" y="15" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">✓ OCI Cloud</text>
      </g>
      <g transform="translate(88, 24)">
        <rect width="90" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
        <text x="45" y="15" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">✓ RAG Pipelines</text>
      </g>
      <g transform="translate(186, 24)">
        <rect width="98" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
        <text x="49" y="15" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">✓ Python/FastAPI</text>
      </g>

      <!-- Gaps to Bridge -->
      <text x="0" y="70" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Prerequisites to Highlight:</text>
      <g transform="translate(0, 80)">
        <rect width="284" height="34" rx="6" fill="#131c31" stroke="rgba(245,158,11,0.3)" />
        <text x="10" y="20" fill="#fde68a" font-family="sans-serif" font-size="10">! Emphasize Distributed Inference on A100 Clusters</text>
      </g>
    </g>

    <!-- AI Action Triggers -->
    <g transform="translate(18, 275)">
      <rect width="284" height="34" rx="6" fill="url(#cyanPurple)" />
      <text x="142" y="21" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Generate Targeted Interview Q&amp;A</text>

      <rect y="44" width="284" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
      <text x="142" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Draft Tailored Cover Letter Hook</text>
    </g>

    <!-- Footer status -->
    <text x="160" y="385" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Manifest V3 • OpenAI Engine • 0ms Lag</text>
  </g>
</svg>
