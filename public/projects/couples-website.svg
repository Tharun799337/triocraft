<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="romBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c1e" />
      <stop offset="100%" stop-color="#09050d" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#romBg)" stroke="rgba(236,72,153,0.3)" stroke-width="2" />

  <!-- Top bar -->
  <rect width="800" height="48" rx="16" fill="#24102d" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <text x="120" y="28" fill="#f472b6" font-family="serif" font-size="14" font-style="italic">Aryan &amp; Ananya // Our Journey &amp; Celebration</text>

  <!-- Hero Banner inside page -->
  <g transform="translate(40, 70)">
    <rect width="720" height="150" rx="12" fill="#2a1236" stroke="rgba(236,72,153,0.2)" />
    
    <!-- Heart accent -->
    <path d="M 360 40 C 360 25, 340 15, 325 28 C 310 15, 290 25, 290 40 C 290 65, 325 85, 325 85 C 325 85, 360 65, 360 40 Z" fill="url(#roseGrad)" transform="translate(35, 10)" />
    
    <text x="360" y="55" fill="#fdf2f8" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">Celebrating Forever</text>
    <text x="360" y="85" fill="#f472b6" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="3">DECEMBER 18, 2026 • JAIPUR, RAJASTHAN</text>
    
    <rect x="270" y="105" width="180" height="30" rx="15" fill="url(#roseGrad)" />
    <text x="360" y="125" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RSVP Your Attendance</text>
  </g>

  <!-- Interactive Story Timeline & RSVP Preview -->
  <g transform="translate(40, 240)">
    <!-- Left: Timeline -->
    <rect width="380" height="230" rx="10" fill="#1d0d26" stroke="rgba(255,255,255,0.06)" />
    <text x="25" y="30" fill="#fbcfe8" font-family="serif" font-size="14" font-weight="bold">Our Story Milestones</text>

    <!-- Timeline item 1 -->
    <circle cx="35" cy="65" r="5" fill="#ec4899" />
    <line x1="35" y1="70" x2="35" y2="120" stroke="#831843" stroke-width="2" />
    <text x="55" y="65" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">First Met in Bangalore (2021)</text>
    <text x="55" y="80" fill="#9d7494" font-family="sans-serif" font-size="10">A rainy evening at a quaint cafe in Indiranagar...</text>

    <!-- Timeline item 2 -->
    <circle cx="35" cy="125" r="5" fill="#ec4899" />
    <line x1="35" y1="130" x2="35" y2="175" stroke="#831843" stroke-width="2" />
    <text x="55" y="125" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">The Proposal in Ladakh (2024)</text>
    <text x="55" y="140" fill="#9d7494" font-family="sans-serif" font-size="10">Under the starry skies of Pangong Lake...</text>

    <!-- Timeline item 3 -->
    <circle cx="35" cy="180" r="5" fill="#ec4899" />
    <text x="55" y="180" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">The Grand Wedding (2026)</text>
    <text x="55" y="195" fill="#9d7494" font-family="sans-serif" font-size="10">Surrounded by our dearest friends and family.</text>

    <!-- Right: Digital Guestbook & RSVP Card -->
    <g transform="translate(400, 0)">
      <rect width="320" height="230" rx="10" fill="#1d0d26" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="30" fill="#fbcfe8" font-family="serif" font-size="14" font-weight="bold">Warm Wishes Guestbook</text>

      <g transform="translate(20, 50)">
        <rect width="280" height="60" rx="8" fill="#2a1236" />
        <text x="12" y="24" fill="#fdf2f8" font-family="sans-serif" font-size="11" font-weight="600">"Wishing you both endless adventures &amp; joy!"</text>
        <text x="12" y="44" fill="#ec4899" font-family="sans-serif" font-size="10">— Priya &amp; Karan (Confirmed RSVP)</text>
      </g>

      <g transform="translate(20, 120)">
        <rect width="280" height="60" rx="8" fill="#2a1236" />
        <text x="12" y="24" fill="#fdf2f8" font-family="sans-serif" font-size="11" font-weight="600">"Can't wait to dance at the Sangeet celebration!"</text>
        <text x="12" y="44" fill="#ec4899" font-family="sans-serif" font-size="10">— Rohan (Confirmed RSVP)</text>
      </g>

      <text x="160" y="210" fill="#9d7494" font-family="sans-serif" font-size="10" text-anchor="middle">Music Playlist • Photo Memories • Responsive Mobile UI</text>
    </g>
  </g>
</svg>
