<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="50%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="coupleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9F1239" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#roseBg)" />

  <!-- Floating Hearts Background Accent -->
  <g opacity="0.15">
    <path d="M 680 80 C 680 60, 650 60, 650 90 C 650 120, 680 140, 680 160 C 680 140, 710 120, 710 90 C 710 60, 680 60, 680 80 Z" fill="#E11D48" />
    <path d="M 120 70 C 120 55, 95 55, 95 80 C 95 105, 120 120, 120 135 C 120 120, 145 105, 145 80 C 145 55, 120 55, 120 70 Z" fill="#E11D48" />
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="220" height="32" rx="16" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1" />
  <circle cx="56" cy="52" r="5" fill="#E11D48" />
  <text x="70" y="57" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9F1239" letter-spacing="1">ROMANTIC DIGITAL EXPERIENCES</text>

  <!-- Section Title -->
  <text x="40" y="105" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#881337">ForeverAfter — Surprise &amp; Apology Portals</text>
  <text x="40" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#9F1239">Personalized Couple Timelines, Heartfelt Apologies, Secret Keys &amp; Music</text>

  <!-- Main Portal Mockup Frame -->
  <g transform="translate(40, 155)" filter="url(#coupleShadow)">
    <rect width="720" height="310" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect width="720" height="36" rx="16" fill="#FFF1F2" />
    <rect y="26" width="720" height="10" fill="#FFF1F2" />
    <line x1="0" y1="36" x2="720" y2="36" stroke="#FFE4E6" stroke-width="1" />
    
    <circle cx="24" cy="18" r="5" fill="#FB7185" />
    <circle cx="40" cy="18" r="5" fill="#F43F5E" />
    <circle cx="56" cy="18" r="5" fill="#E11D48" />
    <rect x="90" y="9" width="320" height="18" rx="9" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1" />
    <text x="105" y="22" font-family="monospace" font-size="10" fill="#BE123C">https://foreverwithyou.triocraft.studio/memories</text>

    <!-- Card 1: Interactive Love & Memories Timeline -->
    <g transform="translate(24, 52)">
      <rect width="215" height="234" rx="12" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
      <rect x="16" y="16" width="183" height="105" rx="8" fill="url(#purpleGrad)" />
      <!-- Couple Silhouette / Heart icon -->
      <path d="M 107 55 C 107 42, 90 42, 90 60 C 90 80, 107 92, 107 102 C 107 92, 124 80, 124 60 C 124 42, 107 42, 107 55 Z" fill="#FFFFFF" />
      <text x="107" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3 Years Together ✨</text>
      
      <text x="16" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#881337">Our Love Timeline</text>
      <text x="16" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#9F1239">From our first coffee at 2021 to forever. 140 photos curated.</text>
      <rect x="16" y="185" width="183" height="30" rx="8" fill="#E11D48" />
      <text x="107" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">UNLOCK PRIVATE VAULT 🗝️</text>
    </g>

    <!-- Card 2: Interactive "I'm Sorry" & Forgiveness Note -->
    <g transform="translate(255, 52)">
      <rect width="215" height="234" rx="12" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
      <rect x="16" y="16" width="183" height="40" rx="8" fill="#F3E8FF" />
      <text x="26" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B21A8">🕊️ SINCERE APOLOGY</text>
      <text x="26" y="47" font-family="system-ui, sans-serif" font-size="9" fill="#9333EA">"I was wrong, please hear me out"</text>
      
      <!-- Handwritten style apology letter snippet -->
      <rect x="16" y="66" width="183" height="110" rx="8" fill="#FFFFFF" stroke="#E9D5FF" />
      <text x="26" y="88" font-family="cursive, system-ui" font-size="11" fill="#4A044E">"My heart hurts without you.</text>
      <text x="26" y="105" font-family="cursive, system-ui" font-size="11" fill="#4A044E">I promise to always listen and</text>
      <text x="26" y="122" font-family="cursive, system-ui" font-size="11" fill="#4A044E">never let ego stand between us.</text>
      <text x="26" y="139" font-family="cursive, system-ui" font-size="11" fill="#4A044E">Can you forgive me?"</text>
      <text x="26" y="162" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#BE185D">Forever Yours, Tharun ❤️</text>

      <!-- Yes/No Forgiveness Buttons -->
      <rect x="16" y="186" width="85" height="30" rx="8" fill="#10B981" />
      <text x="58" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">I Forgive You 🥰</text>

      <rect x="114" y="186" width="85" height="30" rx="8" fill="#CBD5E1" />
      <text x="156" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Hug Me First 🥺</text>
    </g>

    <!-- Card 3: Midnight Birthday & Surprise Reveal -->
    <g transform="translate(485, 52)">
      <rect width="210" height="234" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      
      <!-- Gift box illustration -->
      <rect x="16" y="16" width="178" height="100" rx="8" fill="#FEF3C7" stroke="#FCD34D" />
      <circle cx="105" cy="50" r="22" fill="#F59E0B" />
      <text x="105" y="58" text-anchor="middle" font-size="20">🎁</text>
      <text x="105" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">MIDNIGHT SURPRISE</text>
      <text x="105" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#B45309">Auto-Unlocks at 00:00 AM</text>

      <text x="16" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#78350F">Surprise Video &amp; Letter</text>
      <text x="16" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">With our custom couple song playlist</text>

      <!-- Music Player Bar -->
      <rect x="16" y="166" width="178" height="26" rx="6" fill="#FFFFFF" stroke="#FDE68A" />
      <text x="24" y="183" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">▶ Playing: "Golden Hour" 01:24</text>

      <!-- Reveal Button -->
      <rect x="16" y="200" width="178" height="26" rx="6" fill="#D97706" />
      <text x="105" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">POP BALLOONS &amp; REVEAL 🎈</text>
    </g>
  </g>
</svg>
