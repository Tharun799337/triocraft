<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="ragCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ragPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ragBg)" stroke="rgba(56,189,248,0.2)" stroke-width="2" />
  
  <!-- Browser / App Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#0f172a" />
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="48" cy="22" r="6" fill="#f59e0b" />
  <circle cx="68" cy="22" r="6" fill="#10b981" />
  <rect x="180" y="10" width="440" height="24" rx="6" fill="#1e293b" />
  <text x="400" y="26" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">rag-pdf-assistant.enterprise.internal / chat</text>

  <!-- Left Sidebar: Document Ingestion -->
  <rect x="20" y="60" width="220" height="420" rx="10" fill="#0c1322" stroke="rgba(255,255,255,0.06)" />
  <text x="35" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Document Vault</text>
  <rect x="35" y="102" width="190" height="28" rx="6" fill="#1e293b" />
  <text x="45" y="120" fill="#38bdf8" font-family="sans-serif" font-size="11">+ Upload PDF / Docs</text>

  <!-- Ingested Docs list -->
  <g transform="translate(35, 142)">
    <rect width="190" height="42" rx="6" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <text x="10" y="18" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">financial_report_q3.pdf</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="9">142 pages • 1,280 Chunks</text>
  </g>
  <g transform="translate(35, 194)">
    <rect width="190" height="42" rx="6" fill="#131c2e" />
    <text x="10" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11">system_architecture.pdf</text>
    <text x="10" y="32" fill="#64748b" font-family="monospace" font-size="9">54 pages • 420 Chunks</text>
  </g>
  <g transform="translate(35, 246)">
    <rect width="190" height="42" rx="6" fill="#131c2e" />
    <text x="10" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11">service_sla_contract.pdf</text>
    <text x="10" y="32" fill="#64748b" font-family="monospace" font-size="9">18 pages • 160 Chunks</text>
  </g>

  <!-- Vector DB Metric Pill -->
  <rect x="35" y="380" width="190" height="80" rx="8" fill="#090e1a" stroke="rgba(168,85,247,0.3)" />
  <text x="45" y="402" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Vector Index Status</text>
  <text x="45" y="422" fill="#94a3b8" font-family="monospace" font-size="10">Cosine Similarity: 0.94</text>
  <text x="45" y="442" fill="#34d399" font-family="monospace" font-size="10">● ChromaDB Connected</text>

  <!-- Main Chat Workspace -->
  <rect x="255" y="60" width="525" height="420" rx="10" fill="#0b1220" stroke="rgba(255,255,255,0.06)" />
  
  <!-- User Message -->
  <g transform="translate(275, 80)">
    <rect width="485" height="44" rx="8" fill="#1e293b" />
    <text x="15" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12">What was the Q3 operating margin and what risk factors were highlighted?</text>
  </g>

  <!-- Assistant Response with Citations -->
  <g transform="translate(275, 138)">
    <rect width="485" height="230" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.25)" />
    <circle cx="24" cy="24" r="10" fill="url(#ragCyan)" />
    <text x="24" y="28" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AI</text>
    <text x="44" y="27" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">RAG Assistant (Strict Grounding)</text>

    <text x="20" y="60" fill="#e2e8f0" font-family="sans-serif" font-size="12">According to Section 4.2 of <tspan fill="#38bdf8">[financial_report_q3.pdf, Page 38]</tspan>:</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">1. Operating margin settled at <tspan fill="#34d399" font-weight="bold">28.4%</tspan>, showing a 320 bps year-over-year expansion.</text>
    <text x="20" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="11">2. Primary risk factors flagged include enterprise client churn in APAC and cloud egress cost scaling.</text>

    <!-- Source Chunk Verification Badge -->
    <rect x="20" y="130" width="445" height="80" rx="6" fill="#0a0f1d" stroke="rgba(56,189,248,0.2)" />
    <text x="32" y="150" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">Source Citation Snippet #1 [Confidence 98.2%]:</text>
    <text x="32" y="170" fill="#94a3b8" font-family="monospace" font-size="10">"...Adjusted operating income reached $4.2M yielding an operating margin of 28.4%..."</text>
    <text x="32" y="192" fill="#a855f7" font-family="sans-serif" font-size="10">Verified via LangChain Vector Retrieval • Zero Hallucination Mode</text>
  </g>

  <!-- Query Input Box -->
  <g transform="translate(275, 415)">
    <rect width="485" height="48" rx="8" fill="#131c2e" stroke="rgba(56,189,248,0.3)" />
    <text x="20" y="28" fill="#64748b" font-family="sans-serif" font-size="12">Ask any question across uploaded documents...</text>
    <rect x="420" y="10" width="55" height="28" rx="6" fill="url(#ragCyan)" />
    <text x="447" y="27" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Send</text>
  </g>
</svg>
