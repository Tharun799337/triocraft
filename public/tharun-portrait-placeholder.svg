<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="280" cy="240" r="100" fill="#a855f7" opacity="0.12" filter="url(#softGlow)" />

  <!-- Geometric Tech Rings -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35" />
  <circle cx="200" cy="180" r="95" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />

  <!-- Stylized Developer Avatar Silhouette -->
  <!-- Shoulders -->
  <path d="M120 320 C120 260 150 240 200 240 C250 240 280 260 280 320 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Inner hoodie / collar accent -->
  <path d="M175 242 L200 275 L225 242" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Head & Hair -->
  <circle cx="200" cy="170" r="48" fill="#334155" stroke="#475569" stroke-width="2" />
  <path d="M160 165 C160 130 180 120 200 120 C220 120 240 130 240 165 C230 145 220 138 200 138 C180 138 170 145 160 165 Z" fill="#0f172a" />

  <!-- Modern Tech Glasses / Visor HUD -->
  <rect x="172" y="160" width="24" height="12" rx="4" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="204" y="160" width="24" height="12" rx="4" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="196" y1="166" x2="204" y2="166" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Floating AI / Full Stack Tech Badges -->
  <g transform="translate(45, 80)">
    <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="40" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;REACT/&gt;</text>
  </g>
  <g transform="translate(275, 95)">
    <rect width="82" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <text x="41" y="18" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI + RAG</text>
  </g>
  <g transform="translate(255, 285)">
    <rect width="100" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <text x="50" y="18" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FULL STACK</text>
  </g>

  <!-- Name tag footer -->
  <rect x="70" y="340" width="260" height="34" rx="8" fill="#0a0f1d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="200" y="362" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">VIJAY • AI &amp; WEB DEV</text>
</svg>
